<div class="auth-container">
    <!-- Formulaire de Connexion -->
    <div *ngIf="isLoginMode" class="login-form">
      <h2>Connexion</h2>
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Email:</label>
          <input type="email" [(ngModel)]="email" name="email" required>
        </div>
        <div class="form-group">
          <label>Mot de passe:</label>
          <input type="password" [(ngModel)]="password" name="password" required>
        </div>
        <button type="submit">Se connecter</button>
        <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
      </form>
      <p>Pas encore de compte? <a (click)="switchMode()">Créer un compte</a></p>
    </div>
  
    <!-- Formulaire d'Inscription -->
    <div *ngIf="!isLoginMode" class="register-form">
      <h2>Inscription</h2>
      <form (ngSubmit)="onRegister()">
        <div class="form-group">
          <label>Email:</label>
          <input type="email" [(ngModel)]="registerEmail" name="registerEmail" required>
        </div>
        <div class="form-group">
          <label>Mot de passe:</label>
          <input type="password" [(ngModel)]="registerPassword" name="registerPassword" required>
        </div>
        <button type="submit">S'inscrire</button>
        <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
        <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
      </form>
      <p>Déjà un compte? <a (click)="switchMode()">Se connecter</a></p>
    </div>
  </div>
